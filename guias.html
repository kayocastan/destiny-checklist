<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guias · DPI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1219;--p1:#121a24;--p2:#18222e;--ln:#1f2a36;--ln2:#2a3542;--fg:#e8edf2;--mu:#8d99a6;--mu2:#9fb0c2;--mu3:#6c7a89;--tx:#c9d3dd;
    --cy:#6fd3ff;--gr:#7fe08f;--ye:#f2d36b;--rd:#ff8a7a;
    --display:"Rajdhani","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}[hidden]{display:none!important}
  button,input,select,textarea{font:inherit;color:inherit}
  .k{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
  .gp{max-width:1440px;margin:0 auto;padding:24px 32px 40px;display:grid;gap:18px 22px;align-items:start}
  .gp.v-list{grid-template-columns:300px minmax(0,1fr)}.gp.v-enc{grid-template-columns:280px minmax(0,1fr) 400px}
  header{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .t{display:flex;flex-direction:column}header .t b{font:700 32px/1 var(--display)}
  nav{display:flex;gap:6px;margin-left:24px}
  nav button{padding:8px 16px;border-radius:10px;border:1px solid var(--ln2);background:none;font-size:14px;cursor:pointer}
  nav button[aria-pressed=true]{background:rgba(111,211,255,.18);border-color:var(--cy);font-weight:600}
  nav button[data-view=enc][aria-pressed=true]{background:rgba(127,224,143,.16);border-color:var(--gr)}
  .last{margin-left:auto;font-size:13px;color:var(--mu2)}
  .btn{padding:8px 14px;border:1px solid var(--ln2);border-radius:9px;background:none;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.cy{background:var(--cy);border-color:var(--cy);color:#0b1520;font-weight:700}.btn.gr{background:var(--gr);border-color:var(--gr);color:#0b1520;font-weight:700}
  .btn.rd{border-color:rgba(255,107,107,.5);color:var(--rd)}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .lnk{background:none;border:0;padding:0;font-size:13px;color:var(--cy);cursor:pointer;justify-self:start;align-self:flex-start;text-align:left}
  .gate{grid-column:1/-1;font-size:15px;color:var(--rd)}
  aside{display:flex;flex-direction:column;gap:10px;min-width:0}
  .srch{border:1px solid var(--ln2);border-radius:10px;padding:9px 12px;font-size:14px;background:none;width:100%}.srch::placeholder{color:var(--mu)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:4px 10px;border-radius:999px;border:1px solid var(--ln2);background:none;font-size:12.5px;cursor:pointer}
  .chips button[aria-pressed=true]{background:rgba(111,211,255,.18);border-color:var(--cy)}
  .acts{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 210px);overflow:auto;padding-right:2px}
  .act{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--p1);border:1px solid var(--ln);text-align:left;cursor:pointer}
  .act.on{background:rgba(111,211,255,.12);border-color:var(--cy)}
  .act span{display:flex;flex-direction:column;min-width:0}.act b{font-size:14px}.act small{font-size:12px;color:var(--mu2)}.act i{font:500 11px var(--mono);font-style:normal}
  main{display:flex;flex-direction:column;gap:14px;min-width:0}
  .mh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.mh .th{width:64px;height:40px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,#3b4a2c,#18222e)}
  .mh b{font:700 28px/1 var(--display)}.mh small{font-size:13px;color:var(--mu2)}.mh .btn{margin-left:auto}
  .tbl{border:1px solid var(--ln);border-radius:14px;background:var(--p1);overflow:hidden}
  .tr{display:grid;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}.tr:last-child{border-bottom:0}
  .tbl.v .tr{grid-template-columns:28px 76px minmax(0,1.6fr) minmax(0,1fr) 150px 150px}.tbl.i .tr{grid-template-columns:28px 96px minmax(0,1.6fr) minmax(0,.6fr) 150px 150px}
  .tr.hd{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mu)}
  .tr.hid{opacity:.5}.tr.drag{opacity:.35}.tr.over{box-shadow:inset 0 2px 0 var(--cy)}.tr.sel{background:rgba(111,211,255,.06)}
  .grip{color:var(--mu3);font-size:18px;cursor:grab;user-select:none;text-align:center}
  .vth{width:76px;height:43px;border-radius:6px;object-fit:cover;background:linear-gradient(135deg,#3a2a2a,#1a1416);display:block}.tbl.i .vth{width:96px;height:54px}
  .nm{display:flex;flex-direction:column;min-width:0}.nm b{font-size:14px}.nm small{font-size:12px;color:var(--mu2)}.nm a{font-size:11.5px;color:var(--cy);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec{font-size:13px;color:var(--tx)}
  .org{font:500 11.5px var(--mono);border:1px solid currentColor;border-radius:6px;padding:2px 7px;justify-self:start;white-space:nowrap}
  .acts2{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:18px 14px;color:var(--mu2);font-size:14px;margin:0}
  .form{border:1px solid rgba(111,211,255,.45);border-radius:14px;background:var(--p1);padding:16px 18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .form>b{grid-column:1/-1;font-size:15px}
  label.f{display:flex;flex-direction:column;gap:5px;min-width:0}label.f>small{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mu)}
  .in{border:1px solid var(--ln2);border-radius:9px;padding:9px 11px;font-size:14px;background:var(--p1);width:100%;min-width:0}
  .form .in{background:var(--bg)}
  textarea.in{resize:vertical;line-height:1.4;min-height:40px;overflow:hidden}
  .fbar{grid-column:1/-1;display:flex;gap:8px;align-items:center}.fbar .rd{margin-left:auto}
  .notes{display:flex;gap:18px;font-size:13px;color:var(--mu2);line-height:1.5}.notes b{color:var(--fg)}
  .msg{font-size:13.5px;margin:0}.msg.ok{color:var(--gr)}.msg.bad{color:var(--rd)}
  .sel-act{border:1px solid var(--ln2);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--bg);width:100%}
  .er{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--p1);border:1px solid var(--ln);cursor:pointer;text-align:left}
  .er.on{background:rgba(127,224,143,.14);border-color:var(--gr)}.er b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .er .n{font:500 12px var(--mono);color:var(--mu)}.er .s{font:500 11px var(--mono)}
  .er.drag{opacity:.35}.er.over{box-shadow:0 -2px 0 var(--gr)}
  .add{padding:9px 12px;border:1px dashed var(--ln2);border-radius:10px;font-size:14px;color:var(--mu2);text-align:center;background:none;cursor:pointer}
  .srcb{margin-top:8px;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:13px;color:var(--mu2);line-height:1.5;background:var(--p1);display:grid;gap:6px}
  .srcb>b{color:var(--fg)}.srcb a{color:var(--mu2)}.srcl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.srcf{display:grid;gap:6px}
  .eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.eh>b{font:700 24px var(--display)}
  .draft{font:500 12px var(--mono);color:var(--ye);border:1px solid rgba(242,211,107,.5);border-radius:6px;padding:2px 7px}
  .eh .hint{margin-left:auto;font-size:13px;color:var(--mu2)}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:12px}.g3{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
  .lst{display:flex;flex-direction:column;gap:6px}
  .rr{display:grid;grid-template-columns:18px 180px minmax(0,1fr) 28px;gap:8px;align-items:center}
  .sr{display:grid;grid-template-columns:18px 22px minmax(0,1fr) 28px;gap:8px;align-items:center}.sr .n{font:500 12px var(--mono);color:var(--mu)}
  .rr.drag,.sr.drag{opacity:.35}.rr.over,.sr.over{box-shadow:0 -2px 0 var(--gr)}
  .x{background:none;border:0;color:var(--rd);cursor:pointer;font-size:15px}
  .vsel{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:6px}
  .bbar{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}.bbar .rd{margin-left:auto}
  .pv{border-radius:14px;border:1px solid var(--ln2);background:var(--p2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .pv .tabs{display:flex;gap:5px;flex-wrap:wrap}.pv .tabs span{padding:4px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--ln);background:var(--p1)}
  .pv .tabs span.on{background:rgba(127,224,143,.14);border-color:var(--gr)}
  .pv>b{font:700 20px var(--display)}.pv>small{font:500 10.5px var(--mono);color:var(--mu)}.pv>span{font-size:13.5px;line-height:1.4}
  .pv .roles{display:flex;gap:5px;flex-wrap:wrap}.pv .roles span{padding:3px 8px;border-radius:8px;border:1px solid var(--ln2);font-size:12px}.pv .roles b{color:var(--ye)}
  .pv ol{margin:0;padding-left:18px;font-size:12.5px;line-height:1.4;color:var(--tx);display:flex;flex-direction:column;gap:3px}
  .pv .tip{border-radius:9px;padding:8px 10px;background:rgba(242,211,107,.08);border:1px solid rgba(242,211,107,.35);font-size:12.5px}.pv .tip b{color:var(--ye)}
  .pv .yt{font-size:12.5px;color:var(--cy);text-decoration:none}
  .who{border:1px solid rgba(242,211,107,.45);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--tx);background:rgba(242,211,107,.06);line-height:1.5}.who b{color:var(--ye)}
  .hist{border:1px solid var(--ln2);border-radius:12px;background:var(--p1);padding:12px 14px;display:grid;gap:8px;font-size:13px}
  .hist div{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sticky{position:sticky;top:16px}
  @media (max-width:1250px){.gp.v-enc{grid-template-columns:260px minmax(0,1fr)}.gp.v-enc>.right{grid-column:2}}
  @media (max-width:1000px){.gp{padding:18px 16px 40px}.gp.v-list,.gp.v-enc{grid-template-columns:1fr}.gp.v-enc>.right{grid-column:auto}nav{margin-left:0}.acts{max-height:260px}.sticky{position:static}
    .tbl.v .tr,.tbl.i .tr{grid-template-columns:28px 76px minmax(0,1fr)}.tr>.ec,.tr>.org{grid-column:3}.tr>.acts2{grid-column:1/-1}.tr.hd{display:none}
    .form{grid-template-columns:1fr 1fr}.notes{flex-direction:column;gap:6px}.rr{grid-template-columns:18px 120px minmax(0,1fr) 28px}.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gp v-list" id="app">
  <header><div class="t"><span class="k">DPI · só para o dono do site</span><b>Guias</b></div>
    <nav id="nav" hidden><button type="button" data-view="vid">▶ Vídeos</button><button type="button" data-view="img">🖼 Imagens</button><button type="button" data-view="enc">📖 Encontros</button></nav>
    <span class="last" id="last"></span><a class="btn" href="/">← Voltar ao site</a></header>
  <p class="gate" id="gate">Conferindo seu login…</p>
</div>
<script>
(async () => {
  const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const app = $('app'), gate = t => { $('gate').textContent = t; };
  const auth = (() => { try { return JSON.parse(localStorage.getItem('dc-auth')); } catch { return null; } })();
  const api = await fetch('/data/api.json').then(r => r.json()).then(j => j.url || j.api).catch(() => null);
  if (!auth?.access_token || auth.access_expires < Date.now()) return gate('Entre no site (ou abra a página inicial para renovar o login) e volte aqui.');
  const H = () => ({ Authorization: 'Bearer ' + auth.access_token, 'Content-Type': 'application/json' });
  const who = await fetch(api + '/whoami', { headers: H() }).then(r => r.json()).catch(() => ({}));
  if (!who.owner) return gate('Esta página é só para o dono do site.');
  const [defs, GUIDES] = await Promise.all([fetch('/data/defs.json').then(r => r.json()), fetch('/data/guides.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({}))]);
  const [g0, v0] = await Promise.all([fetch(api + '/guias?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => ({ m: {} })), fetch(api + '/videos?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => ({ list: [] }))]);
  const GOV = g0.m || {}, VIDS = v0.list || [];
  $('gate').remove(); $('nav').hidden = false;

  const N = a => Array.isArray(a.n) ? (a.n[1] || a.n[0]) : a.n;
  const GR = [['raid', 'Incursões', 'incursão', defs.raids], ['dg', 'Masmorras', 'masmorra', defs.dungeons], ['xm', 'Missões exóticas', 'missão exótica', defs.xmissions || []]];
  const ACT = {}; for (const [kind, , , l] of GR) for (const a of l) ACT[kind + ':' + a.k] = a;
  const kindOf = k => GR.find(g => k.startsWith(g[0] + ':'));
  const clone = x => JSON.parse(JSON.stringify(x));
  const YT = u => /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(u || '');
  const ytId = u => { try { const x = new URL(u); return x.hostname === 'youtu.be' ? x.pathname.slice(1) : x.searchParams.get('v') || ''; } catch { return ''; } };
  const ytT = u => { try { return +(new URL(u).searchParams.get('t') || '').replace(/s$/, '') || 0; } catch { return 0; } };
  const ytSet = (u, sec) => { try { const x = new URL(u); if (sec > 0) x.searchParams.set('t', sec + 's'); else x.searchParams.delete('t'); return x.toString(); } catch { return u; } };
  const mmss = s => s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
  const secOf = v => { const m = String(v || '').trim().match(/^(\d+)(?::(\d{1,2}))?$/); return !m ? 0 : m[2] != null ? +m[1] * 60 + +m[2] : +m[1] * 60; };
  const when = t => { const d = new Date(t), now = new Date(), hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); return d.toDateString() === now.toDateString() ? 'hoje ' + hm : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + hm; };
  const TY = [['enc', 'Encontro'], ['boss', 'Chefe'], ['final', 'Chefe final'], ['pas', 'Passagem']];
  const qs = new URLSearchParams(location.search);
  const S = { view: ['vid', 'img', 'enc'].includes(qs.get('t')) ? qs.get('t') : 'vid', k: ACT[qs.get('a')] ? qs.get('a') : 'raid:ce', q: '', ed: null, i: 0, dirty: false, msg: null, hist: null, histOpen: false, srcEd: false, draftSeen: false };
  S.cat = S.k.split(':')[0];

  // o que o site mostra hoje (padrão ou ajuste salvo)
  const linksOf = k => { const o = GOV['lnk:' + k]; if (o) return o.l.map(x => ({ u: x[0], pt: x[1] || '', en: x[2] || '', h: !!x[3], e: +x[4] || 0, lg: x[5] || '', o: x[6] || 'cms' }));
    const a = ACT[k], l = Array.isArray(a.yt) ? a.yt : a.yt ? [[a.yt]] : [];
    return [...l.map(x => ({ u: x[0], pt: x[1] || 'Guia em vídeo', en: x[2] || 'Video guide', h: false, e: 0, lg: '', o: 'site' })), ...VIDS.filter(v => v.k === k).sort((a, b) => a.ord - b.ord).map(v => ({ u: v.url, pt: v.pt || '', en: v.en || '', h: false, e: 0, lg: '', o: 'cms' }))]; };
  const imgsOf = k => { const o = GOV['img:' + k]; if (o) return o.l.map(x => ({ u: x[0], pt: x[1] || '', en: x[2] || '', w: x[3] || 0, ht: x[4] || 0, h: !!x[5], o: x[6] || (x[0].startsWith('/guides/') ? 'site' : 'cms') }));
    return (ACT[k].gi || []).map(x => ({ u: x[0], pt: x[1] || '', en: x[2] || '', w: x[3] || 0, ht: x[4] || 0, h: false, o: 'site' })); };
  const norm = g => { g.enc.forEach(e => { e.roles ||= []; e.steps ||= []; e.tip ||= ''; e.obj ||= ''; e.t ||= /\(passagem\)/.test(e.n) ? 'pas' : 'enc'; }); return g; };
  const encOf = k => { const o = GOV['enc:' + k] || GUIDES[k]; return norm(o ? clone({ src: o.src || [], enc: o.enc || [] }) : { src: [], enc: [] }); };
  const lastAt = k => Math.max(0, ...['lnk', 'img', 'enc'].map(t => GOV[t + ':' + k]?.at || 0));

  async function put(t, k, v) {
    const r = await fetch(api + '/guias/' + encodeURIComponent(t + ':' + k), { method: 'PUT', headers: H(), body: JSON.stringify(v) }).then(r => r.json()).catch(() => ({ error: 'Sem conexão com o servidor.' }));
    if (r.ok) GOV[t + ':' + k] = { ...v, at: Date.now() }; return r;
  }
  const saveLinks = (k, L) => put('lnk', k, { l: L.map(r => [r.u, r.pt, r.en, r.h ? 1 : 0, r.e || 0, r.lg || '', r.o]) });
  const saveImgs = (k, L) => put('img', k, { l: L.map(r => [r.u, r.pt, r.en, r.w || 0, r.ht || 0, r.h ? 1 : 0, r.o]) });

  let W = null; // cópia em edição da aba atual
  const load = () => { W = S.view === 'vid' ? linksOf(S.k) : S.view === 'img' ? imgsOf(S.k) : encOf(S.k); S.dirty = false; S.ed = null; S.hist = null; S.histOpen = false; if (S.view === 'enc') S.i = Math.min(S.i, Math.max(0, W.enc.length - 1)); };

  function sideHTML() {
    const q = S.q.trim().toLowerCase();
    const list = Object.keys(ACT).filter(k => q ? N(ACT[k]).toLowerCase().includes(q) : k.startsWith(S.cat + ':'));
    return `<input class="srch" id="q" type="search" placeholder="🔍 Buscar atividade…" value="${esc(S.q)}">
      <div class="chips">${GR.map(([c, t]) => `<button type="button" data-cat="${c}" aria-pressed="${!q && S.cat === c}">${t}</button>`).join('')}</div>
      <div class="acts">${list.map(k => { const nv = linksOf(k).filter(x => !x.h).length, ni = imgsOf(k).filter(x => !x.h).length, g = GOV['enc:' + k] || GUIDES[k], ne = g?.enc?.length || 0;
        const st = !ne ? ['vazio', 'var(--rd)'] : !nv ? ['sem vídeo', 'var(--ye)'] : ['✓', 'var(--gr)'];
        return `<button type="button" class="act${k === S.k ? ' on' : ''}" data-act="${esc(k)}"><span><b>${esc(N(ACT[k]))}</b><small>${nv} vídeo${nv === 1 ? '' : 's'} · ${ni} image${ni === 1 ? 'm' : 'ns'} · ${ne ? ne + ' encontros' : 'sem guia'}</small></span><i style="color:${st[1]}">${st[0]}</i></button>`; }).join('') || '<p class="empty">Nada encontrado.</p>'}</div>`;
  }
  const encOpts = sel => `<option value="0">Todos</option>${encOf(S.k).enc.map((e, i) => `<option value="${i + 1}"${+sel === i + 1 ? ' selected' : ''}>${i + 1} · ${esc(e.n)}</option>`).join('')}`;
  const actOpts = sel => GR.map(([c, t, , l]) => `<optgroup label="${t}">${l.map(x => `<option value="${c}:${esc(x.k)}"${c + ':' + x.k === sel ? ' selected' : ''}>${esc(N(x))}</option>`).join('')}</optgroup>`).join('');
  const msgP = () => S.msg ? `<p class="msg ${S.msg.ok ? 'ok' : 'bad'}">${esc(S.msg.t)}</p>` : '';
  function vidHTML() {
    const a = ACT[S.k], g = encOf(S.k), vis = W.filter(x => !x.h).length;
    const org = r => r.h ? [(r.o === 'site' ? 'DO SITE' : 'CADASTRADO') + ' · ESCONDIDO', 'var(--mu3)'] : r.o === 'site' ? ['DO SITE', 'var(--mu2)'] : ['CADASTRADO', 'var(--cy)'];

    if (d.new != null) { S.ed = 'new'; S.msg = null; draw(); $('fu')?.focus(); return; }
    if (d.edit != null) { S.ed = +d.edit; S.msg = null; draw(); document.querySelector('.form')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
    if (d.fcancel != null) { S.ed = null; S.msg = null; draw(); return; }
    if (d.hide != null) { const L = clone(W); L[+d.hide].h = !L[+d.hide].h; return commit(L, L[+d.hide].h ? 'Escondido.' : 'Visível de novo.'); }
    if (d.fdel != null) { if (!confirm('Apagar da lista? (Para só ocultar, use Esconder.)')) return; const L = clone(W); L.splice(S.ed, 1); return commit(L, 'Apagado.'); }
    if (d.reset != null) { if (!confirm('Apagar seus ajustes e voltar à lista padrão do site?')) return; const t = S.view === 'vid' ? 'lnk' : 'img'; const r = await fetch(api + '/guias/' + encodeURIComponent(t + ':' + S.k), { method: 'DELETE', headers: H() }).then(r => r.json()).catch(() => ({}));
      if (r.ok) { delete GOV[t + ':' + S.k]; load(); flash('Voltou ao padrão do site.', true); } else flash(r.error || 'Não deu.'); draw(); return; }
    if (d.fsave == null) return;
    const u = $('fu').value.trim(), pt = $('fpt').value.trim(), en = $('fen').value.trim();
    if (S.view === 'vid') {
      if (!YT(u)) { flash('Use um link do YouTube (https://www.youtube.com/… ou https://youtu.be/…).'); draw(); return; }
      const row = { ...(S.ed === 'new' ? { h: false, o: 'cms' } : W[S.ed]), u: ytSet(u, secOf($('ft').value)), pt, en, e: +$('fe').value || 0, lg: $('flg').value }, k2 = $('fk').value;
      if (k2 !== S.k) { const L2 = linksOf(k2); L2.push({ ...row, e: 0 }); const r2 = await saveLinks(k2, L2); if (!r2.ok) { flash(r2.error || 'Não deu para mover.'); draw(); return; }
        const L = clone(W); if (S.ed !== 'new') L.splice(S.ed, 1); return commit(L, `Movido para ${N(ACT[k2])}.`); }
      const L = clone(W); if (S.ed === 'new') L.push(row); else L[S.ed] = row; return commit(L, 'Salvo. No site, aparece em alguns minutos.');
    }
    if (!/^https:\/\//.test(u) && !u.startsWith('/guides/')) { flash('Cole um link https da imagem.'); draw(); return; }
    let w = 0, ht = 0; if (S.ed === 'new' || u !== W[S.ed]?.u) { const im = new Image(); im.src = u; await im.decode().catch(() => {}); if (!im.naturalWidth) { flash('Não consegui abrir essa imagem.'); draw(); return; } w = im.naturalWidth; ht = im.naturalHeight; }
    const row = { ...(S.ed === 'new' ? { h: false, o: 'cms' } : W[S.ed]), u, pt, en }; if (w) { row.w = w; row.ht = ht; }
    const L = clone(W); if (S.ed === 'new') L.push(row); else L[S.ed] = row; return commit(L, 'Salvo. No site, aparece em alguns minutos.');
  }
  // arrastar para ordenar: vídeos/imagens (grava na hora), encontros, papéis e passos (vira rascunho)
  let dragSrc = null; const attr = el => ['dnd', 'ednd', 'rdnd', 'sdnd'].find(a => el.dataset[a] != null);
  app.addEventListener('dragstart', ev => { const r = ev.target.closest?.('[data-dnd],[data-ednd],[data-rdnd],[data-sdnd]'); if (!r) return; dragSrc = r; r.classList.add('drag'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ''); });
  app.addEventListener('dragend', () => { dragSrc?.classList.remove('drag'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); dragSrc = null; });
  app.addEventListener('dragover', ev => { if (!dragSrc) return; const a = attr(dragSrc), t = ev.target.closest(`[data-${a}]`); if (!t) return; ev.preventDefault(); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); if (t !== dragSrc) t.classList.add('over'); });
  app.addEventListener('drop', async ev => {
    if (!dragSrc) return; const a = attr(dragSrc), t = ev.target.closest(`[data-${a}]`); if (!t || t === dragSrc) return; ev.preventDefault();
    const from = +dragSrc.dataset[a], to = +t.dataset[a], mv = l => { const [x] = l.splice(from, 1); l.splice(to, 0, x); };
    if (a === 'dnd') { const L = clone(W); mv(L); S.ed = null; return commit(L, 'Ordem salva.'); }
    if (a === 'ednd') { mv(W.enc); S.i = to; } else if (a === 'rdnd') mv(W.enc[S.i].roles); else mv(W.enc[S.i].steps);
    S.dirty = true; S.msg = null; draw();
  });
  // campos de texto dentro de linhas arrastáveis: o arrasto só começa pelo ⋮⋮
  app.addEventListener('mousedown', ev => { const row = ev.target.closest('[data-rdnd],[data-sdnd],[data-dnd]'); if (row) row.draggable = !!ev.target.closest('.grip'); });
  addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's' && S.view === 'enc') { ev.preventDefault(); if (S.dirty) publish(); } });
  addEventListener('beforeunload', e => { if (S.dirty) e.preventDefault(); });
  load(); draw();
})();
