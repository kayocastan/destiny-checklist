name: Orla Bot (Cloudflare)
on:
  push:
    branches: [main]
    paths: ['orla-bot/**', '!orla-bot/legacy-python/**', '.github/workflows/orla-bot.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: orla-bot
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
    defaults:
      run:
        working-directory: orla-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Testes
        run: npx vitest run
      - name: Banco D1 `orla` (cria se ainda não existir)
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="orla");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then npx wrangler d1 create orla; id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="orla").uuid)'); fi
          echo "id do banco: $id"
          sed -i "s/__DB_ID__/$id/" wrangler.toml
      - name: Tabelas e catálogo
        run: npx wrangler d1 migrations apply orla --remote
      - name: Subdomínio workers.dev
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e 'const j=JSON.parse(require("fs").readFileSync(0));process.stdout.write(j.result&&j.result.subdomain||"")')
          echo "subdomínio: $sub"
          [ -n "$sub" ] || { echo "conta sem subdomínio workers.dev (o worker dni-api cria)"; exit 1; }
          echo "SUB=$sub" >> $GITHUB_ENV
          sed -i "s/__SUB__/$sub/; s/__DISCORD_APP_ID__/$DISCORD_APP_ID/" wrangler.toml
      - name: Publica
        run: npx wrangler deploy
      - name: Segredos do worker
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: |
          for n in DISCORD_TOKEN DISCORD_PUBLIC_KEY DISCORD_CLIENT_SECRET BUNGIE_API_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$n"; else echo "segredo $n não configurado no GitHub"; fi
          done
      - name: Comandos /orla no servidor do Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: "1474588542410686716"
        run: |
          if [ -n "$DISCORD_TOKEN" ] && [ -n "$DISCORD_APP_ID" ]; then node scripts/register-commands.mjs; else echo "sem DISCORD_TOKEN/DISCORD_APP_ID: comandos não registrados"; fi
      - name: Grava o endereço do bot no site
        working-directory: .
        run: |
          url="https://orla-bot.$SUB.workers.dev"
          echo "{\"api\":\"$url\"}" > data/orla.json
          if ! git diff --quiet -- data/orla.json 2>/dev/null || [ -z "$(git ls-files data/orla.json)" ]; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add data/orla.json && git commit -m "Endereço do Orla Bot: $url" && git pull --rebase --autostash && git push
          fi
